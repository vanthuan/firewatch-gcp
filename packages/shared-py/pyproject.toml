[project]
name = "launchpad-shared"
version = "0.1.0"
description = "Models shared by LaunchPad agents and workers (Step 2.1)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchpad_shared"]
